name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  waf-quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy

      - name: Run unit tests
        run: python -B -m coverage run -m unittest discover -s tests

      - name: Report coverage
        run: python -B -m coverage report

      - name: Run ReDoS probe
        run: python -B scripts/redos_probe.py

      - name: Run input WAF eval
        run: >
          python -B scripts/evaluate.py
          --direction input
          --min-precision 0.95
          --min-recall 0.95
          --min-category-recall 0.95

      - name: Run output WAF eval
        run: >
          python -B scripts/evaluate.py
          --direction output
          --min-precision 0.95
          --min-recall 0.95
          --min-category-recall 0.95

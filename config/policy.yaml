# LLM-WAF route policy.
#
# The gateway runs with this default policy if POLICY_PATH points here.
# Delete or unset POLICY_PATH to use equivalent built-in defaults.

default:
  input_scanning: true
  output_scanning: true
  redact_inputs: true
  redact_outputs: true
  block_prompt_injection: true
  scan_tool_arguments: true
  scan_tool_results: true
  audit: true
  blocked_status_code: 403
  disabled_rules: []
  disabled_categories: []

routes:
  - name: chat_completions
    path: /v1/chat/completions
    input_scanning: true
    output_scanning: true
    redact_inputs: true
    redact_outputs: true
    block_prompt_injection: true
    scan_tool_arguments: true
    scan_tool_results: true
    blocked_status_code: 403
    disabled_rules: []
    disabled_categories: []

  - name: metadata_passthrough
    path: /v1/models
    input_scanning: false
    output_scanning: false
    redact_inputs: false
    redact_outputs: false

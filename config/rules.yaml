# Default LLM-WAF scanner rules.
#
# Rules are intentionally conservative. High-confidence prompt-injection
# findings block by default; sensitive data and output leaks redact by default.

input:
  - rule_id: inj.ignore_previous.en
    category: prompt_injection
    severity: critical
    action: block
    pattern: >-
      \b(ignore|disregard|forget)\s+(all\s+)?(previous|prior|above|earlier)\s+(instructions?|rules?|directives?)\b
    description: Attempts to override higher-priority instructions.
    tags: [en, prompt_injection, override]
    recommended_remediation: Review the prompt source and remove instructions that try to override trusted policy.

  - rule_id: inj.system_prompt_extract.en
    category: system_prompt_extraction
    severity: critical
    action: block
    pattern: >-
      \b(reveal|show|print|output|repeat|tell\s+me|dump)\s+(your\s+)?(system\s+prompt|developer\s+message|hidden\s+instructions?|initial\s+instructions?)\b
    description: Attempts to extract hidden system or developer instructions.
    tags: [en, system_prompt, extraction]
    recommended_remediation: Do not expose system, developer, or hidden instruction text to the model response.

  - rule_id: inj.role_hijack.en
    category: role_hijack
    severity: high
    action: block
    pattern: >-
      \b(you\s+are\s+now.{0,60}(unrestricted|admin|developer|root|jailbroken|hacker|no\s+restrictions?)|pretend\s+(you\s+are|to\s+be).{0,80}(without\s+(any\s+)?(safety|content)\s+filters?|no\s+restrictions?|unrestricted|hacker|criminal)|act\s+as\s+if\s+you\s+(are|were).{0,80}(without\s+(any\s+)?safety|no\s+restrictions?|unrestricted|hacker|criminal)|switch\s+to\s+(developer|admin|god)\s+mode)\b
    description: Attempts to replace the assistant identity or operating mode.
    tags: [en, role_hijack, jailbreak]
    recommended_remediation: Keep role or persona requests inside the allowed application behavior.

  - rule_id: inj.jailbreak.en
    category: jailbreak
    severity: high
    action: block
    pattern: >-
      \b(DAN|do\s+anything\s+now|jailbreak|bypass\s+(the\s+)?(safety|filter|restriction|guardrail)s?)\b
    description: Known jailbreak or safety-bypass terminology.
    tags: [en, jailbreak, bypass]
    recommended_remediation: Remove safety-bypass language before forwarding the request.

  - rule_id: inj.template_tags
    category: prompt_injection
    severity: high
    action: block
    pattern: >-
      (</?(system|user|assistant|developer|human|ai)\s*>|\[/?(INST|SYS)\]|<\|im_(start|end)\|>)
    description: Chat template or role-tag injection.
    tags: [template, role_tag, prompt_injection]
    recommended_remediation: Treat chat template markers in user content as untrusted data, not control tokens.

  - rule_id: inj.ignore_previous.zh
    category: prompt_injection
    severity: critical
    action: block
    pattern: >-
      (忽略|无视|忘记|不要管).{0,12}(之前|上面|以上|所有|原来).{0,12}(指令|规则|要求|设定)
    description: 中文指令覆盖攻击。
    tags: [zh, prompt_injection, override]
    recommended_remediation: 移除试图覆盖上级指令或规则的中文提示。

  - rule_id: inj.system_prompt_extract.zh
    category: system_prompt_extraction
    severity: critical
    action: block
    pattern: >-
      (显示|输出|打印|泄露|告诉我|重复).{0,12}(系统提示词|system prompt|初始设定|内部指令|隐藏指令)
    description: 中文系统提示词探测。
    tags: [zh, system_prompt, extraction]
    recommended_remediation: 不要把系统提示词、初始设定或隐藏指令返回给用户。

  - rule_id: inj.bypass.zh
    category: jailbreak
    severity: high
    action: block
    pattern: >-
      (进入开发者模式|开发者模式|解除限制|绕过安全|关闭安全|关闭过滤|不要遵守安全)
    description: 中文越狱或安全过滤绕过。
    tags: [zh, jailbreak, bypass]
    recommended_remediation: 移除绕过安全策略或关闭过滤的请求。

  - rule_id: inj.role_hijack.zh
    category: role_hijack
    severity: high
    action: block
    pattern: >-
      (现在的你是|你现在是|从现在开始你是|角色扮演).{0,20}(不受限制|无视规则|黑客|邪恶|无限制)
    description: 中文角色劫持攻击。
    tags: [zh, role_hijack, jailbreak]
    recommended_remediation: 将角色扮演限制在可信系统提示和应用允许的范围内。

sensitive:
  - rule_id: secret.openai_key
    category: secret
    severity: critical
    action: redact
    pattern: >-
      \bsk-[A-Za-z0-9_-]{20,}\b
    description: OpenAI-style API key.
    replacement: "[REDACTED:api_key]"
    tags: [secret, api_key]
    recommended_remediation: Remove provider API keys before sending traffic upstream.

  - rule_id: secret.github_token
    category: secret
    severity: critical
    action: redact
    pattern: >-
      \bgh[pousr]_[A-Za-z0-9_]{30,}\b
    description: GitHub token.
    replacement: "[REDACTED:github_token]"
    tags: [secret, github]
    recommended_remediation: Revoke exposed tokens and rotate credentials.

  - rule_id: secret.aws_access_key
    category: secret
    severity: critical
    action: redact
    pattern: >-
      \bAKIA[0-9A-Z]{16}\b
    description: AWS access key id.
    replacement: "[REDACTED:aws_access_key]"
    tags: [secret, aws]
    recommended_remediation: Revoke exposed cloud credentials and rotate the associated key pair.

  - rule_id: secret.private_key
    category: secret
    severity: critical
    action: redact
    pattern: >-
      -----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]+?-----END [A-Z ]*PRIVATE KEY-----
    description: Private key block.
    replacement: "[REDACTED:private_key]"
    tags: [secret, private_key]
    recommended_remediation: Remove private key material and rotate any affected certificate or key pair.

  - rule_id: secret.generic_assignment
    category: secret
    severity: high
    action: redact
    pattern: >-
      \b(api[_-]?key|secret|access[_-]?token|auth[_-]?token|password|passwd)\s*[:=]\s*['"]?[A-Za-z0-9_\-./+=]{8,}['"]?
    description: Generic credential assignment.
    replacement: '\1=[REDACTED:secret]'
    tags: [secret, credential]
    recommended_remediation: Remove credential assignments from prompts and responses.

  - rule_id: pii.email
    category: pii
    severity: medium
    action: redact
    pattern: >-
      \b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b
    description: Email address.
    replacement: "[REDACTED:email]"
    tags: [pii, email]
    recommended_remediation: Mask personal email addresses unless the route is explicitly trusted for PII.

  - rule_id: pii.cn_mobile
    category: pii
    severity: medium
    action: redact
    pattern: >-
      (?<!\d)1[3-9]\d{9}(?!\d)
    description: Chinese mainland mobile number.
    replacement: "[REDACTED:cn_mobile]"
    tags: [pii, cn, phone]
    recommended_remediation: Mask phone numbers unless the route is explicitly trusted for PII.

  - rule_id: pii.cn_id
    category: pii
    severity: high
    action: redact
    pattern: >-
      (?<!\d)[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx](?!\d)
    description: Chinese resident identity card number.
    replacement: "[REDACTED:cn_id]"
    tags: [pii, cn, identity]
    recommended_remediation: Mask national ID numbers unless the route is explicitly trusted for PII.

output:
  - rule_id: out.system_prompt_leak.en
    category: system_prompt_leak
    severity: high
    action: redact
    pattern: >-
      \b(my|the)\s+(system\s+prompt|developer\s+message|hidden\s+instructions?)\s+(is|are|was|were|says|contains)\b.{0,500}
    description: Output appears to disclose hidden instructions.
    replacement: "[REDACTED:system_prompt]"
    tags: [en, output, system_prompt]
    recommended_remediation: Redact leaked instruction text and inspect the preceding user prompt for extraction attempts.

  - rule_id: out.system_prompt_leak.zh
    category: system_prompt_leak
    severity: high
    action: redact
    pattern: >-
      (我的|当前|系统的)?(系统提示词|开发者消息|隐藏指令|初始设定)(是|为|包含).{0,500}
    description: 输出疑似泄露系统提示词。
    replacement: "[REDACTED:system_prompt]"
    tags: [zh, output, system_prompt]
    recommended_remediation: 脱敏泄露的隐藏指令，并检查上游请求是否存在提示词提取攻击。

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="LLM-WAF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3a3a40"/>
      <stop offset="100%" stop-color="#2a2a2e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', 'Segoe UI', sans-serif">
    <text x="600" y="190" text-anchor="middle"
          font-size="96" font-weight="200" letter-spacing="14"
          fill="#f5f5f7">LLM<tspan fill="#6b6b70">·</tspan>WAF</text>

    <line x1="540" y1="220" x2="660" y2="220" stroke="url(#hair)" stroke-width="1"/>

    <text x="600" y="258" text-anchor="middle"
          font-size="15" font-weight="400" letter-spacing="6"
          fill="#8a8a90">A SECURITY GATEWAY FOR LLM APIs</text>
  </g>
</svg>

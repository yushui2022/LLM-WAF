[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-waf"
version = "0.1.0"
description = "Zero-intrusion LLM security gateway with streaming proxy, redaction, audit logs, and dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LLM-WAF contributors" }]
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.29.0",
  "httpx==0.27.0",
  "python-dotenv==1.0.1",
  "PyYAML==6.0.1",
  "redis==5.0.4",
]

[project.scripts]
llm-waf = "app.cli:main"

[project.optional-dependencies]
semantic = [
  "numpy>=1.26.0,<3.0.0",
  "onnxruntime>=1.20.0,<2.0.0",
  "tokenizers>=0.20.0,<1.0.0",
]
dev = [
  "build>=1.2.0,<2.0.0",
  "coverage[toml]>=7.6.0,<8.0.0",
  "mypy>=1.14.0,<2.0.0",
  "ruff>=0.8.0,<1.0.0",
  "types-PyYAML>=6.0.12,<7.0.0",
  "wheel>=0.45.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "docs*", "examples*", "rules*", "scripts*", "tests*", "var*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]
